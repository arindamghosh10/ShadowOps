services:
  postgres:
    image: postgres:16-alpine
    container_name: shadowops_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: shadowops
      POSTGRES_PASSWORD: shadowops_dev_password
      POSTGRES_DB: shadowops
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shadowops"]
      interval: 5s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: shadowops_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  postgres_data:
  qdrant_data:
